name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug

      # 3️⃣ Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 4️⃣ Install Node dependencies
      - name: Install Node Dependencies
        run: npm ci

      # 5️⃣ Install PHP dependencies
      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # 6️⃣ Copy environment file
      - name: Copy Environment File
        run: cp .env.example .env

      # 7️⃣ Generate application key
      - name: Generate Application Key
        run: php artisan key:generate --force

      # 8️⃣ Setup testing environment & override drivers
      - name: Setup Testing Environment
        run: php artisan config:clear
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          WAYFINDER_SKIP_GENERATE: 1

      # 9️⃣ Run migrations for testing
      - name: Run Migrations
        run: php artisan migrate --force
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

      # 🔟 Build frontend assets
      - name: Build Assets
        run: npm run build
        env:
          WAYFINDER_SKIP_GENERATE: 1

      # 11️⃣ Run tests
      - name: Run Tests
        run: ./vendor/bin/pest
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
